<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LIU Sign-Up">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#4E97CE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>LIU Sign-Up</title>
<script>
// Any failure in the page's code shows on screen (bottom banner) instead of
// leaving buttons that silently do nothing.
(function () {
  function show(msg) {
    var el = document.getElementById('fault');
    if (!el) { el = document.createElement('div'); el.id = 'fault'; el.className = 'fault'; (document.body || document.documentElement).appendChild(el); }
    el.textContent = 'Something went wrong: ' + msg + ' — please tell the Homebase admin.';
  }
  window.addEventListener('error', function (e) { show((e.message || 'error') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; show((r && (r.message || r.name)) || String(r)); });
})();
</script>
<style>
/* Homebase's look, scaled up for touch: Public Sans (the app's default font),
   the grey page, white panels with the navy hairline, semibold navy panel
   titles over a soft divider, navy-ink fields with a navy focus ring, outlined
   navy secondary buttons and the gold primary button of the LIU theme.
   Source: crm_app/static/hb_base.css (R5/R6, .card-panel, [data-brand="liu"]).
   LIU blue + gold carry the bar, the stripe and the primary actions; text on a
   blue or gold surface is always white, on the "shadowed" shade of each hue. */
@font-face { font-family: 'Public Sans'; font-style: normal; font-weight: 100 900; font-display: swap; src: url("public-sans.woff2") format('woff2'); }
:root {
  --liu-blue: #69B3E7;
  --liu-blue-shade: #4E97CE;
  --liu-blue-deep: #3D7EB0;
  --liu-gold: #FFC72C;
  --liu-gold-shade: #CF9A10;
  --liu-gold-deep: #B8880C;
  --navy: #1B3A5C;            /* --at-dark */
  --navy-hover: #16314e;
  --ink: #1B3A5C;
  --muted: #646d75;           /* --text-muted */
  --page: #f0f2f5;            /* --page-bg */
  --card: #ffffff;
  --card-border: #c6d1de;     /* the navy hairline */
  --line-soft: #e3e6ea;       /* panel-header dividers */
  --field-border: rgba(27,58,92,.62);
  --ring: 0 0 0 4px rgba(27,58,92,.15);
  --elev: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.05);
  --r-sm: 8px;                /* --hb-r-sm, touch-scaled */
  --r-lg: 12px;               /* --hb-r-lg, touch-scaled */
  --danger: #b42318;
  --ok: #1f7a4d;
  --font: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--page);
  color: var(--ink);
  font: 17px/1.45 var(--font);
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea, button { font-family: var(--font); }

/* ---------- LIU bar (Homebase's LIU menu bar: shaded blue, white wordmark) ---------- */
.bar {
  background: linear-gradient(180deg, #57A2D8 0%, var(--liu-blue-shade) 100%);
  box-shadow: inset 0 -6px 12px -8px rgba(0,0,0,0.28);
  border-bottom: 4px solid var(--liu-gold);
  padding-top: env(safe-area-inset-top);
}
.bar-in {
  max-width: 900px; margin: 0 auto;
  height: 72px; padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.bar .brand { display: block; height: 24px; width: auto; max-width: 70%; }
.lock {
  flex: none;
  width: 44px; height: 44px; padding: 0; margin: 0;
  border-radius: 22px; border: 1px solid rgba(255,255,255,.55);
  background: rgba(255,255,255,.14); color: #fff;
  display: flex; align-items: center; justify-content: center;
  -webkit-appearance: none; appearance: none; line-height: 0;
}
.lock:active { background: rgba(255,255,255,.3); }
.lock svg { display: block; width: 20px; height: 20px; }

/* ---------- page heading ---------- */
.hero { max-width: 900px; margin: 0 auto; padding: 34px 20px 6px; }
.hero h1 { margin: 0; font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.015em; color: var(--navy); }
.hero p { margin: 8px 0 0; font-size: 18px; color: var(--muted); }
.hero .accent { display: block; width: 44px; height: 4px; border-radius: 2px; background: var(--liu-gold); margin-bottom: 16px; }

/* ---------- panels (.card-panel) ---------- */
main.form-wrap { max-width: 900px; margin: 0 auto; padding: 22px 20px 120px; }
.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  box-shadow: var(--elev);
  padding: 20px 22px 22px;
  margin-bottom: 18px;
}
.card > h2 {
  margin: -20px -22px 18px; padding: 14px 22px;
  border-bottom: 1px solid var(--line-soft);
  font-size: 17px; font-weight: 600; color: var(--navy); letter-spacing: 0;
}
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
.grid .wide { grid-column: 1 / -1; }
.grid.addr { grid-template-columns: 2fr 1fr .8fr; }
@media (max-width: 640px) {
  .grid, .grid.addr { grid-template-columns: 1fr; }
}
label.f { display: block; }
label.f > span { display: block; font-size: 15px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
label.f > span b { color: var(--danger); font-weight: 600; }

/* ---------- fields (R6: one control box) ---------- */
input[type=text], input[type=email], input[type=tel], input[type=password], select, textarea {
  width: 100%;
  font-size: 18px; font-weight: 500; line-height: 1.35;
  min-height: 52px; padding: 12px 14px;
  border: 1px solid var(--field-border);
  border-radius: var(--r-sm);
  background: #fff;
  color: var(--navy);
  -webkit-appearance: none;
  appearance: none;
}
input::placeholder, textarea::placeholder { color: rgba(27,58,92,.55); opacity: 1; }
select {
  background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%231B3A5C' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 14px center;
  background-size: 14px 10px;
  padding-right: 42px;
}
textarea { min-height: 100px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--navy); box-shadow: var(--ring); }
.invalid { border-color: var(--danger) !important; }

/* ---------- choice buttons (Homebase secondary button; chosen = navy) ---------- */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 640px) { .seg { grid-template-columns: 1fr; } }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  display: flex; align-items: center; justify-content: center; text-align: center;
  min-height: 54px; padding: 10px 12px;
  border: 1px solid var(--field-border); border-radius: var(--r-sm); background: #fff;
  color: var(--navy); font-weight: 500; font-size: 17px;
}
.seg input:checked + label { border-color: var(--navy); background: var(--navy); color: #fff; font-weight: 600; }
.seg input:focus-visible + label { box-shadow: var(--ring); }
.seg.invalid label { border-color: var(--danger); }
.intl-row {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
  margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-soft);
}
.intl-row .q { font-size: 15px; font-weight: 600; color: var(--navy); margin: 6px 18px 6px 0; }
.seg.seg2 { grid-template-columns: 1fr 1fr; width: 240px; max-width: 100%; }
.seg.seg2 label { min-height: 48px; }

/* ---------- searchable program picker ---------- */
.combo { position: relative; }
.combo input { padding-right: 50px; }
.combo-clear {
  position: absolute; right: 8px; top: 8px;
  width: 36px; height: 36px; padding: 0; border: 0; border-radius: 18px; background: #e9edf2;
  color: var(--navy); font-size: 22px; line-height: 36px; text-align: center;
}
.combo-list {
  list-style: none; margin: 6px 0 0; padding: 4px 0;
  max-height: 320px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: #fff; border: 1px solid var(--card-border); border-radius: var(--r-sm);
  box-shadow: 0 8px 24px rgba(16,24,40,.12);
}
.combo-list li { padding: 13px 16px; font-size: 17px; color: var(--navy); cursor: pointer; }
.combo-list li + li { border-top: 1px solid var(--line-soft); }
.combo-list li.act, .combo-list li:active { background: #eef4fa; }
.combo-list li.undecided { color: var(--muted); font-style: italic; }
.combo-list li.none { color: var(--muted); cursor: default; }
.combo-list mark { background: none; color: var(--liu-blue-deep); font-weight: 700; }

/* ---------- primary action (LIU .btn-primary: shaded gold, white text) ---------- */
.submit {
  display: block; width: 100%;
  min-height: 60px; padding: 16px; border: 1px solid var(--liu-gold-shade); border-radius: var(--r-sm);
  background: var(--liu-gold-shade); color: #fff;
  font-size: 20px; font-weight: 600; letter-spacing: .01em;
  text-shadow: 0 1px 2px rgba(0,0,0,.25);
  -webkit-appearance: none; appearance: none;
  transition: background-color .13s ease, transform .09s ease;
}
.submit:active { transform: scale(0.98); background: var(--liu-gold-deep); border-color: var(--liu-gold-deep); }
.err { color: var(--danger); font-weight: 600; text-align: center; margin: 0 0 12px; min-height: 1.4em; }

/* ---------- thank-you ---------- */
.thanks {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 30;
  background: linear-gradient(180deg, #57A2D8 0%, var(--liu-blue-deep) 100%); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 24px;
  text-shadow: 0 1px 2px rgba(0,0,0,.18);
}
.thanks .brand { position: absolute; top: calc(env(safe-area-inset-top) + 32px); left: 0; right: 0; margin: 0 auto; height: 26px; }
.thanks .check {
  width: 96px; height: 96px; border-radius: 48px; background: var(--liu-gold-shade);
  box-shadow: 0 0 0 6px rgba(255,199,44,.35);
  display: flex; align-items: center; justify-content: center; margin-bottom: 22px;
}
.thanks .check svg { width: 52px; height: 52px; }
.thanks h2 { margin: 0; font-size: 40px; font-weight: 700; }
.thanks p { margin: 10px 0 0; font-size: 20px; opacity: .9; }

/* ---------- PIN pad ---------- */
.pin {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 40;
  background: rgba(27,58,92,.55);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.pin-box { background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 340px; text-align: center; border: 1px solid var(--card-border); box-shadow: 0 16px 40px rgba(16,24,40,.25); }
.pin-box h3 { margin: 0 0 4px; font-size: 20px; font-weight: 700; color: var(--navy); }
.pin-box .sub { margin: 0 0 14px; color: var(--muted); font-size: 15px; min-height: 1.4em; }
.pin-box .sub.bad { color: var(--danger); font-weight: 600; }
.dots { display: flex; justify-content: center; margin: 6px 0 18px; }
.dots i { width: 16px; height: 16px; border-radius: 8px; border: 2px solid var(--navy); margin: 0 7px; }
.dots i.on { background: var(--navy); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.keys button {
  height: 62px; border-radius: var(--r-sm); border: 1px solid var(--line-soft); background: var(--page);
  font-size: 26px; font-weight: 600; color: var(--navy); -webkit-appearance: none; appearance: none;
}
.keys button:active { background: #dfe4ea; }
.keys .txt { font-size: 16px; font-weight: 600; color: var(--muted); }

/* ---------- staff view ---------- */
.staff { max-width: 980px; margin: 0 auto; padding: 22px 20px 60px; }
.staff-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 16px; }
.staff-bar h1 { margin: 6px 16px 6px 0; font-size: 28px; font-weight: 700; color: var(--navy); }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 10px 16px; min-height: 46px; border-radius: var(--r-sm);
  border: 1px solid var(--field-border); background: #fff; color: var(--navy);
  font-weight: 500; font-size: 16px; white-space: nowrap;
  -webkit-appearance: none; appearance: none;
}
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--liu-gold-shade); border-color: var(--liu-gold-shade); color: #fff; font-weight: 600; text-shadow: 0 1px 1px rgba(0,0,0,.2); }
.btn.primary:active { background: var(--liu-gold-deep); border-color: var(--liu-gold-deep); }
.btn.navy { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 600; }
.btn.danger { color: var(--danger); border-color: #e3a49d; }
.btn:disabled { opacity: .45; }
.row { display: flex; flex-wrap: wrap; align-items: center; margin: -5px; }
.row > * { margin: 5px; }
.toggle { display: flex; align-items: center; font-weight: 600; font-size: 15px; color: var(--navy); }
.toggle input { width: 22px; height: 22px; margin: 0 10px 0 0; accent-color: var(--navy); }
.ver { text-align: center; color: var(--muted); font-size: 13px; margin-top: 18px; }

.group { border: 1px solid var(--card-border); border-radius: var(--r-sm); margin-bottom: 14px; overflow: hidden; }
.group-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 16px; background: #f7f9fb; border-bottom: 1px solid var(--line-soft); }
.group-head h3 { margin: 6px 12px 6px 0; font-size: 18px; font-weight: 600; color: var(--navy); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #e9edf2; color: var(--muted); font-size: 13px; font-weight: 700; margin-left: 8px; vertical-align: 2px; }
.pill.new { background: #fff4d6; color: #8a6100; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 10px 16px; border-top: 1px solid var(--line-soft); vertical-align: middle; color: var(--navy); }
thead th { border-top: 0; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: #fff; }
td .x { border: 0; background: none; color: var(--muted); font-size: 20px; padding: 4px 8px; }
td.sent { color: var(--ok); font-weight: 600; font-size: 13px; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%);
  background: var(--navy); color: #fff; padding: 12px 18px; border-radius: var(--r-sm); font-weight: 600; z-index: 50;
  max-width: calc(100% - 32px);
}
/* If anything in the page's code fails, say so on screen instead of silently
   doing nothing (11/11: the iPad's lock "did nothing" with no clue why). */
.fault {
  position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); z-index: 60;
  background: #fff4f2; color: var(--danger); border: 1px solid #e3a49d; border-radius: var(--r-sm);
  padding: 10px 14px; font-size: 14px; font-weight: 600;
}
</style>
</head>
<body>

<!-- ======================= STUDENT FORM ======================= -->
<div id="formView">
  <header class="bar">
    <div class="bar-in">
      <img class="brand" src="liu-logo-white.png" alt="Long Island University">
      <button type="button" class="lock" id="lockBtn" aria-label="Staff">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
    </div>
  </header>
  <section class="hero">
    <span class="accent"></span>
    <h1 id="heading">Let's stay in touch!</h1>
    <p id="subheading">Tell us a little about yourself</p>
  </section>

  <main class="form-wrap">
    <form id="signup" novalidate autocomplete="off">
      <section class="card">
        <h2>About you</h2>
        <div class="grid">
          <label class="f"><span>First name <b>*</b></span>
            <input type="text" name="fs_first" id="first_name" required autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" maxlength="60"></label>
          <label class="f"><span>Last name <b>*</b></span>
            <input type="text" name="fs_last" id="last_name" required autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" maxlength="60"></label>
          <label class="f"><span>Email <b>*</b></span>
            <input type="email" name="fs_mail" id="email" required inputmode="email" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="120"></label>
          <label class="f"><span>Mobile phone</span>
            <input type="tel" name="fs_tel" id="phone" inputmode="tel" autocomplete="off" maxlength="30"></label>
        </div>
      </section>

      <section class="card">
        <h2>I am a…</h2>
        <div class="seg" role="radiogroup" aria-label="Student type">
          <input type="radio" name="fs_type" id="t_fre" value="First-Year"><label for="t_fre">High school student</label>
          <input type="radio" name="fs_type" id="t_trn" value="Transfer"><label for="t_trn">Transfer student</label>
          <input type="radio" name="fs_type" id="t_gra" value="Graduate"><label for="t_gra">Graduate student</label>
        </div>
        <div class="intl-row">
          <span class="q" id="intlQ">Are you an international student?</span>
          <div class="seg seg2" role="radiogroup" aria-labelledby="intlQ">
            <input type="radio" name="fs_intl" id="i_yes" value="yes"><label for="i_yes">Yes</label>
            <input type="radio" name="fs_intl" id="i_no" value="no"><label for="i_no">No</label>
          </div>
        </div>
        <div class="grid" id="countryWrap" style="margin-top:16px" hidden>
          <label class="f wide"><span>Country</span>
            <input type="text" name="fs_country" id="country" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" maxlength="60"></label>
        </div>
        <div class="grid" style="margin-top:18px">
          <label class="f"><span id="schoolLabel">Current school</span>
            <input type="text" name="fs_school" id="high_school" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" maxlength="120"></label>
          <label class="f"><span>Graduation year</span>
            <select name="fs_grad" id="grad_year"></select></label>
          <label class="f"><span>When would you start?</span>
            <select name="fs_term" id="admit_term"></select></label>
          <label class="f" id="campusWrap"><span>Campus</span>
            <select name="fs_campus" id="campus"></select></label>
          <div class="wide" id="majorWrap">
            <label class="f" for="intended_major"><span>What would you like to study?</span></label>
            <div class="combo">
              <input type="text" name="fs_major" id="intended_major" placeholder="Search programs" role="combobox"
                     aria-autocomplete="list" aria-expanded="false" aria-controls="majorList"
                     autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="120">
              <button type="button" class="combo-clear" id="majorClear" aria-label="Clear" hidden>×</button>
              <ul class="combo-list" id="majorList" role="listbox" hidden></ul>
            </div>
          </div>
        </div>
      </section>

      <section class="card" id="addrCard">
        <h2>Mailing address</h2>
        <div class="grid">
          <label class="f wide"><span>Street address</span>
            <input type="text" name="fs_street" id="address" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="120"></label>
        </div>
        <div class="grid addr" style="margin-top:16px">
          <label class="f"><span>City</span>
            <input type="text" name="fs_city" id="city" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" maxlength="60"></label>
          <label class="f"><span>State</span>
            <input type="text" name="fs_state" id="state" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="30"></label>
          <label class="f"><span>ZIP</span>
            <input type="text" name="fs_zip" id="postal" inputmode="numeric" autocomplete="off" maxlength="10"></label>
        </div>
      </section>

      <section class="card">
        <label class="f"><span>Questions or comments</span>
          <textarea name="fs_note" id="comment" autocomplete="off" maxlength="1000"></textarea></label>
      </section>

      <p class="err" id="formErr" role="alert"></p>
      <button type="submit" class="submit">Sign me up</button>
    </form>
  </main>

</div>

<!-- ======================= THANK YOU ======================= -->
<div class="thanks" id="thanks" hidden>
  <img class="brand" src="liu-logo-white.png" alt="Long Island University">
  <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h2 id="thanksName">Thank you!</h2>
  <p>We'll be in touch soon.</p>
</div>

<!-- ======================= PIN ======================= -->
<div class="pin" id="pin" hidden>
  <div class="pin-box">
    <h3 id="pinTitle">Staff PIN</h3>
    <p class="sub" id="pinSub"></p>
    <div class="dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
    <div class="keys" id="pinKeys">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>

<script>

  // ---------- small helpers ----------

nd Design BFA","Digital Engineering BE","Digital Game Design/Dev BFA","Early Childhood/SWD BS","Entrepreneurship BS","Exercise Sci & Wellnes BS","Fashion Merchandising & Mgt BS","Film and Television BFA","Film BFA","Finance BS","Forensic Science BS","Global Studies BA","Health Sciences BS","Hlth Ed & Phys Ed BS","Int Relations & Diplomacy BA","Journalism BFA","Marketing BS","Mathematics BS","Music Education B-12 BM","Music Tech  Ent & Prod BFA","Nursing BS","Nutrition and Dietetics BS","Pharmacy Professional PharmD","Political Science BA","Post Visiting Undergraduate","Psychology BA","Radiologic Technology BS","Social Work BS","Speech Lang Path and Audio BS","Sports Management BS","Theatre Arts BFA","Undeclared","Undeclared Major","Undeclared: Pre-Law","Veterinary Technology BS"],"G":["Accountancy MS","Adolescence Education 7-12 MS","Archives & Records Mgt. Certif","Artificial Intelligence MS","Behavior Analysis MA","Biology MS","Biomedical Sciences MS","Business Administration MBA","Childhood Ed/SWD AllGrades MS","Clinical Art Ther & Couns MA","Clinical Lab Sciences MS","Clinical Ment Hlth Coun ADVCRT","Clinical Mental Hlth Couns MS","Comp Sci/Dig Fluency ADV CRT","Criminal Justice MS","Data Anal & Strat Bus Intel MS","Early Childhood/Childhood MS","Educational Leadership ADV CRT","Educational Leadership MSED","Family Nurse Practitioner MS","Genetic Counseling MS","Health Administration MHA","Information Studies PhD","Lib Info Sci/Schl Lib Media MS","Library and Info Science MS","Library Sci Non-Degree Studies","Literacy (All Grades) MSED","Management Engineering M.S.","Museum Studies M.A.","Physical Therapy DPT","Psychology - Clinical-PsyD","Public Library Admin ADV CRT","Reg Dietitian Nutritionist MS","School Counseling MS","School Dist Busn Ldr ADV CRT","School Dist Busn Ldr MSED","Social Work MSW","Special Education MSED","Speech-Language Pathology MA","Sports Management MS","Stdnt w/ Disabilites (All)MSED","Transformational Leadershp EdD"]},"Riverhead":{"F":["Childhood Education BS","Communication Stud - New Media","Riverhead Visiting (UG)"],"T":["Childhood Education BS","Communication Stud - New Media","Riverhead Visiting (UG)"],"G":["Childhood Education MS","Non-Degree Studies","Teach Students w/Disabil MS"]},"College of Veterinary Medicine":{"G":["Comp Biomed & Vet Sciences MS","Comp Biomedical Vet Sci PHD","Veterinary Medicine DVM"]}};
  var UNDECIDED = 'Undecided';
  var majorPool = [];
  function normText(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim(); }
  function refreshMajorPool() {
    var typeEl = document.querySelector('input[name=fs_type]:checked');
    var fams = typeEl ? [{ 'First-Year': 'F', 'Transfer': 'T', 'Graduate': 'G' }[typeEl.value]] : ['F', 'T', 'G'];
    var campus = settings.campus || $('campus').value;
    function collect(campuses) {
      var seen = {}, out = [];
      campuses.forEach(function (c) {
        fams.forEach(function (f) {
          ((PROGRAMS[c] || {})[f] || []).forEach(function (p) {
            if (!seen[p]) { seen[p] = 1; out.push(p); }
          });
        });
      });
      return out;
    }
    var pool = campus ? collect([campus]) : [];
    if (!pool.length) pool = collect(Object.keys(PROGRAMS));   // campus with no list → every campus
    pool.sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : 1; });
    majorPool = pool.map(function (p) { return { name: p, norm: normText(p) }; });
    // A major picked for another type or campus doesn't carry over
    // (grad program chosen, then "High school student" → cleared).
    var cur = val('intended_major');
    if (cur && cur !== UNDECIDED && pool.indexOf(cur) < 0) {
      $('intended_major').value = '';
      $('majorClear').hidden = true;
    }
    if (!$('majorList').hidden) renderMajors();
  }

    var words = q.split(' ');
    return majorPool.filter(function (p) {
      return words.every(function (w) { return p.norm.indexOf(w) >= 0; });
    });
  }
  function highlight(name) {
    var words = normText($('intended_major').value).split(' ').filter(Boolean);
    var safe = esc(name);

    var re = new RegExp('(' + words.map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')', 'gi');
    return safe.replace(re, '<mark>$1</mark>');

      ev.preventDefault();

      majorAct = (majorAct + (ev.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;

      ev.preventDefault();                       // never submit the form from here

  // ---------- submit ----------

  });

  function nextField(from) {
    var els = Array.prototype.filter.call($('signup').elements, function (el) {
      if (el.disabled || el.type === 'hidden' || el.type === 'radio' || el.tagName === 'BUTTON') return false;
      return el.offsetParent !== null;          // skip hidden sections (Country, address, campus)
    });
    var i = els.indexOf(from);
    return i >= 0 && i + 1 < els.length ? els[i + 1] : null;

  });

  $('signup').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!tappedSubmit) return;
    tappedSubmit = false;

      var ok = val(id) && (id !== 'email' || EMAIL_RE.test(val(id)));

      if (!ok) bad.push(id);
    });
    if (bad.length) {
      $('formErr').textContent = bad.indexOf('email') >= 0 && val('email')

        : 'Please fill in your name and email.';
      $(bad[0]).focus();
      return;

      id: uid(),
      created: new Date().toISOString(),
      event: eventName(),
      exported: null,
      first_name: val('first_name'),
      last_name: val('last_name'),
      email: val('email').toLowerCase(),
      phone: val('phone'),
      admit_type: typeEl ? (intl ? INTL_TYPE[typeEl.value] : typeEl.value) : '',
      international: intl,
      country: intl ? val('country') : '',
      high_school: val('high_school'),
      grad_year: $('grad_year').value,
      admit_term: $('admit_term').value,
      campus: settings.campus || $('campus').value,
      intended_major: val('intended_major'),
      address: settings.askAddress ? val('address') : '',
      city: settings.askAddress ? val('city') : '',
      state: settings.askAddress ? val('state') : '',
      postal: settings.askAddress ? val('postal') : '',
      comment: val('comment')
    };
    putEntry(entry).then(function () {
      showThanks(entry.first_name);
    }).catch(function () {
      $('formErr').textContent = 'Something went wrong saving that — please ask a staff member.';
    });
  });

  function clearForm() {
    $('signup').reset();
    $('formErr').textContent = '';
    Array.prototype.forEach.call(document.querySelectorAll('.invalid'), function (el) { el.classList.remove('invalid'); });
    $('schoolLabel').textContent = 'Current school';
    $('countryWrap').hidden = true;
    $('majorClear').hidden = true;
    closeMajors();
    refreshMajorPool();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    window.scrollTo(0, 0);
  }
  function showThanks(first) {
    clearForm();
    $('thanksName').textContent = 'Thank you, ' + first + '!';
    $('thanks').hidden = false;
    setTimeout(function () { $('thanks').hidden = true; }, THANKS_MS);
  }
  $('thanks').addEventListener('click', function () { $('thanks').hidden = true; });

  // A walk-away mid-form shouldn't leave someone's details on screen.
  var formIdle;
  function formDirty() {
    return Array.prototype.some.call($('signup').elements, function (el) {
      return (el.type === 'radio' ? el.checked : (el.tagName !== 'BUTTON' && el.tagName !== 'SELECT' && el.value));
    });
  }
  function bumpFormIdle() {
    clearTimeout(formIdle);
    formIdle = setTimeout(function () { if (!$('formView').hidden && formDirty()) clearForm(); }, FORM_IDLE_MS);
  }
  ['input', 'change', 'touchstart', 'keydown'].forEach(function (t) {
    $('signup').addEventListener(t, bumpFormIdle, { passive: true });
  });
  $('signup').addEventListener('input', function (ev) {
    if (ev.target.classList.contains('invalid')) {
      ev.target.classList.remove('invalid');
      if (!document.querySelector('#signup .invalid')) $('formErr').textContent = '';
    }
  });

  // ---------- PIN ----------
  var pinBuf = '', pinMode = 'unlock', pinFirst = '', pinDone = null;
  function openPin(mode, done) {
    pinMode = mode; pinBuf = ''; pinFirst = ''; pinDone = done;
    $('pinTitle').textContent = mode === 'unlock' ? 'Staff PIN' : 'Choose a staff PIN';
    setPinSub(mode === 'unlock' ? '' : '4 digits', false);
    paintDots();
    $('pin').hidden = false;
  }
  function setPinSub(t, bad) { var s = $('pinSub'); s.textContent = t; s.classList.toggle('bad', !!bad); }
  function paintDots() {
    Array.prototype.forEach.call($('pinDots').children, function (d, i) { d.classList.toggle('on', i < pinBuf.length); });
  }
  $('pinKeys').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    var k = b.getAttribute('data-k');
    if (k === 'cancel') {
      $('pin').hidden = true;
      if (pinMode === 'set' && !settings.pin) return; // first run: stay on the form
      return;
    }
    if (k === 'back') { pinBuf = pinBuf.slice(0, -1); paintDots(); return; }
    if (pinBuf.length >= 4) return;
    pinBuf += k; paintDots();
    if (pinBuf.length < 4) return;
    setTimeout(function () {
      if (pinMode === 'unlock') {
        if (pinBuf === settings.pin) { $('pin').hidden = true; pinDone && pinDone(); }
        else { pinBuf = ''; paintDots(); setPinSub('Wrong PIN', true); }
      } else if (!pinFirst) {
        pinFirst = pinBuf; pinBuf = ''; paintDots(); setPinSub('Enter it again', false);
      } else if (pinBuf === pinFirst) {
        settings.pin = pinBuf; saveSettings();
        $('pin').hidden = true; pinDone && pinDone();
      } else {
        pinFirst = ''; pinBuf = ''; paintDots(); setPinSub("Those didn't match — start again", true);
      }
    }, 120);
  });

  $('lockBtn').addEventListener('click', function () {
    if (!settings.pin) openPin('set', function () { toast('PIN set'); showStaff(); });
    else openPin('unlock', showStaff);
  });
  $('changePin').addEventListener('click', function () {
    openPin('set', function () { toast('PIN changed'); bumpStaffIdle(); });
  });

  // ---------- staff view ----------
  var staffIdle;
  function bumpStaffIdle() {
    clearTimeout(staffIdle);
    staffIdle = setTimeout(showForm, STAFF_IDLE_MS);
  }
  ['touchstart', 'click', 'keydown', 'input'].forEach(function (t) {
    $('staffView').addEventListener(t, bumpStaffIdle, { passive: true });
  });

  function showStaff() {
    clearForm();
    $('formView').hidden = true;
    $('staffView').hidden = false;
    $('setEvent').value = settings.event || '';
    $('setHeading').value = settings.heading || '';
    $('setSub').value = settings.sub || '';
    $('setCampus').value = settings.campus || '';
    $('setAddr').checked = !!settings.askAddress;
    window.scrollTo(0, 0);
    bumpStaffIdle();
    renderGroups();
  }
  function showForm() {
    clearTimeout(staffIdle);
    $('staffView').hidden = true;
    $('formView').hidden = false;
    buildOptions();
    applySettings();
    window.scrollTo(0, 0);
  }
  $('backToForm').addEventListener('click', showForm);

  function bindSetting(id, key, prop) {
    $(id).addEventListener(prop === 'checked' ? 'change' : 'input', function () {
      settings[key] = prop === 'checked' ? $(id).checked : $(id).value;
      saveSettings();
      if (key === 'event') renderGroups();
    });
  }
  bindSetting('setEvent', 'event');
  bindSetting('setHeading', 'heading');
  bindSetting('setSub', 'sub');
  bindSetting('setCampus', 'campus');
  bindSetting('setAddr', 'askAddress', 'checked');

  function groupsOf(entries) {
    var map = {}, order = [];
    entries.sort(function (a, b) { return a.created < b.created ? 1 : -1; });
    entries.forEach(function (e) {
      if (!map[e.event]) { map[e.event] = []; order.push(e.event); }
      map[e.event].push(e);
    });
    return order.map(function (name) { return { name: name, items: map[name] }; });
  }

  var lastGroups = [];
  function renderGroups() {
    allEntries().then(function (entries) {
      lastGroups = groupsOf(entries || []);
      var host = $('groups');
      if (!lastGroups.length) {
        host.innerHTML = '<div class="empty">No sign-ups yet</div>';
        return;
      }
      host.innerHTML = lastGroups.map(function (g, gi) {
        var fresh = g.items.filter(function (e) { return !e.exported; }).length;
        var rows = g.items.map(function (e) {
          var d = new Date(e.created);
          return '<tr><td>' + esc(e.first_name + ' ' + e.last_name) +
            (e.international ? ' <span class="pill">Intl</span>' : '') + '</td>' +
            '<td>' + esc(e.email) + '</td>' +
            '<td>' + fmtDate(d) + ' ' + fmtTime(d) + '</td>' +
            (e.exported ? '<td class="sent">Exported</td>' : '<td></td>') +
            '<td style="text-align:right"><button class="x" data-del="' + esc(e.id) + '" aria-label="Delete">×</button></td></tr>';
        }).join('');
        return '<div class="group">' +
          '<div class="group-head"><h3>' + esc(g.name) +
            '<span class="pill">' + g.items.length + '</span>' +
            (fresh ? '<span class="pill new">' + fresh + ' new</span>' : '') + '</h3>' +
          '<div class="row">' +
            (CAN_SHARE ? '<button class="btn primary" data-share="' + gi + '">Email or AirDrop</button>' : '') +
            '<button class="btn' + (CAN_SHARE ? '' : ' primary') + '" data-download="' + gi + '">Download CSV</button>' +
            '<button class="btn danger" data-clear="' + gi + '">Delete list</button>' +
          '</div></div>' +
          '<table><thead><tr><th>Name</th><th>Email</th><th>Signed up</th><th></th><th></th></tr></thead><tbody>' +
          rows + '</tbody></table></div>';
      }).join('');
    });
  }

  $('groups').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-share')) exportGroup(lastGroups[+b.getAttribute('data-share')], 'share');
    else if (b.hasAttribute('data-download')) exportGroup(lastGroups[+b.getAttribute('data-download')], 'download');
    else if (b.hasAttribute('data-clear')) clearGroup(lastGroups[+b.getAttribute('data-clear')]);
    else if (b.hasAttribute('data-del')) {
      var id = b.getAttribute('data-del');
      if (confirm('Delete this sign-up? This cannot be undone.')) delEntries([id]).then(renderGroups);
    }
  });

  function csvCell(v) {
    v = String(v == null ? '' : v);
    // Keep spreadsheet apps from treating a typed value as a formula — but
    // leave "+1 555…" / "-" phone styles alone (a digit, space or paren follows).
    if (/^[=@\t\r]/.test(v) || /^[+\-](?![\d\s(])/.test(v)) v = "'" + v;
    return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function toCsv(items) {
    var lines = [COLUMNS.map(function (c) { return csvCell(c[1]); }).join(',')];
    items.slice().sort(function (a, b) { return a.created < b.created ? -1 : 1; }).forEach(function (e) {
      lines.push(COLUMNS.map(function (c) { return csvCell(e[c[0]]); }).join(','));
    });
    return '﻿' + lines.join('\r\n') + '\r\n';
  }
  function safeName(s) { return s.replace(/[\/\\:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 60); }

  // Email or AirDrop = the iPad's share sheet with the CSV attached (Mail,
  // AirDrop, Messages, Save to Files…); the subject line is filled in.
  // Download CSV = the file straight into Files → Downloads.
  var CAN_SHARE = (function () {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'x.csv', { type: 'text/csv' })] })); }
    catch (e) { return false; }
  })();
  function exportGroup(g, how) {
    if (!g) return;
    var d = new Date();
    var fname = safeName(g.name) + ' - ' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '-' + d.getFullYear() + '.csv';
    var csv = toCsv(g.items);
    function markExported() {
      var stamp = new Date().toISOString();
      var upd = g.items.map(function (e) { var c = Object.assign({}, e); c.exported = c.exported || stamp; return c; });
      return putEntries(upd).then(renderGroups);
    }
    if (how === 'share' && CAN_SHARE) {
      var file = new File([csv], fname, { type: 'text/csv' });
      navigator.share({
        files: [file],
        title: 'LIU sign-ups: ' + g.name,
        text: g.items.length + ' sign-ups from ' + g.name + ' (' + fmtDate(d) + '). Upload the attached CSV in Homebase: open the event, then Upload a list.'
      }).then(function () {
        markExported(); toast('Sent ' + g.items.length + ' sign-ups');
      }).catch(function (err) {
        if (err && err.name !== 'AbortError') { toast('Sharing failed — downloading instead'); downloadCsv(csv, fname, markExported); }
      });
    } else {
      downloadCsv(csv, fname, markExported);
    }
  }
  function downloadCsv(csv, fname, after) {
    var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    var a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    after && after();
    toast('Saved ' + fname);
  }

  function clearGroup(g) {
    if (!g) return;
    var fresh = g.items.filter(function (e) { return !e.exported; }).length;
    var msg = fresh
      ? fresh + ' of these sign-ups have NOT been exported. Delete all ' + g.items.length + ' anyway? This cannot be undone.'
      : 'Delete all ' + g.items.length + ' sign-ups for "' + g.name + '" from this iPad? They have been exported. This cannot be undone.';
    if (confirm(msg)) delEntries(g.items.map(function (e) { return e.id; })).then(function () { toast('Deleted'); renderGroups(); });
  }

  // ---------- start ----------
  buildOptions();
  applySettings();
  if (!settings.pin) {
    openPin('set', function () { toast('PIN set'); showStaff(); });
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
